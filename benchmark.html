<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Benchmark test</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #ff1a1a;
        }
        p {
            font-size: 36px; /* Increased font size for higher visibility */
            font-weight: bold;
            margin-top: 25px;
            text-align: center;
            color: #333;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <button onclick="runLoop()">Run</button>
    <p id="output"></p>

    <script>
        let a = 0;

        function runLoop() {
            const outputText = document.getElementById("output");
            outputText.innerText = "Running...";
            outputText.style.color = "#333";
            
            setTimeout(() => {
                a = 0;
                const start = performance.now();
                
                while (a !== 1000000000) {
                    a += 1;
                }
                
                const end = performance.now();
                const seconds = (end - start) / 1000;
                
                let score = 0;
                if (seconds > 0) {
                    score = Math.round(1000 / seconds);
                }
                
                outputText.innerHTML = `Score: ${score.toLocaleString()}`;
                outputText.style.color = "#28a745";
            }, 50);
        }
    </script>

</body>
</html>
